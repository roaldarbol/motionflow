[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motionflow"
dynamic = ["version"]
description = "CLI and Python API for optical flow video processing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "motionflow contributors" }]
keywords = ["optical-flow", "computer-vision", "video", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "typer>=0.12",
    "rich>=13",
    "tqdm>=4.66",
]

[project.optional-dependencies]
torch = [
    "torch>=2.1",
    "torchvision>=0.16",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
dev-torch = [
    "motionflow[dev]",
    "motionflow[torch]",
]
docs = [
    "zensical>=0.0.24",
    "mkdocstrings[python]>=0.27",
    # mkdocstrings <1.0.7 (the last release for Python <3.12) breaks with pymdown-extensions 12
    "pymdown-extensions<12; python_version < '3.12'",
]

[project.scripts]
motionflow = "motionflow.cli:app"

[project.urls]
Homepage = "https://github.com/roaldarbol/motionflow"
Documentation = "https://roaldarbol.github.io/motionflow"
Repository = "https://github.com/roaldarbol/motionflow"
Issues = "https://github.com/roaldarbol/motionflow/issues"

[tool.hatch.version]
path = "src/motionflow/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/motionflow"]

[tool.uv]
default-groups = []
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]
# torch <2.13 has known advisories. Intel Macs stay on 2.2.2, the last release with
# wheels for them. This constrains uv.lock only, not the published requirements.
constraint-dependencies = [
    "torch>=2.13; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/motionflow"]
omit = ["*/methods/deep.py"]  # deep methods require torch; tested separately

[tool.coverage.report]
show_missing = true