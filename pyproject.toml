[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motionflow"
dynamic = ["version"]
description = "CLI and Python API for optical flow video processing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mikkel Roald-Arbøl" }]
maintainers = [{ name = "Mikkel Roald-Arbøl" }]
keywords = ["optical-flow", "computer-vision", "video", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    # The contrib build is a superset of opencv-python-headless and includes
    # TV-L1. Don't add another OpenCV wheel: they all install into cv2/.
    "opencv-contrib-python-headless>=4.8",
    "numpy>=1.24",
    "typer>=0.12",
    "rich>=13",
    "tqdm>=4.66",
]

[project.optional-dependencies]
torch = [
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.scripts]
motionflow = "motionflow.cli:app"

[project.urls]
Homepage = "https://github.com/roaldarbol/motionflow"
Documentation = "https://roaldarbol.github.io/motionflow"
Repository = "https://github.com/roaldarbol/motionflow"
Issues = "https://github.com/roaldarbol/motionflow/issues"
Changelog = "https://github.com/roaldarbol/motionflow/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/motionflow/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/motionflow"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/pixi.lock"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line too long: handled by the formatter
    "B008",  # function calls in argument defaults: Typer uses this pattern
]

[tool.ruff.lint.isort]
known-first-party = ["motionflow"]

# ---------------------------------------------------------------------------
# Pytest and coverage
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["motionflow"]
omit = ["*/methods/deep.py"]  # deep methods require torch; tested separately

[tool.coverage.report]
show_missing = true
