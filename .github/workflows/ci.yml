name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs, and let the Relock workflow validate main after it
  # commits an updated lock (commits pushed with GITHUB_TOKEN don't trigger
  # `push` runs).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every supported Python on Linux; oldest and newest on macOS and
          # Windows, whose OpenCV video backends differ.
          - { os: ubuntu-latest, environment: py310 }
          - { os: ubuntu-latest, environment: py311 }
          - { os: ubuntu-latest, environment: py312 }
          - { os: ubuntu-latest, environment: default } # 3.13
          - { os: ubuntu-latest, environment: py314 }
          - { os: macos-latest, environment: py310 }
          - { os: macos-latest, environment: py314 }
          - { os: windows-latest, environment: py310 }
          - { os: windows-latest, environment: py314 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          environments: ${{ matrix.environment }}
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} test-cov

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          environments: default
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Check formatting
        run: pixi run format-check

      - name: Lint
        run: pixi run lint

  deep:
    name: Deep methods (PyTorch on CPU)
    runs-on: ubuntu-latest
    env:
      # Let the tests download weights they don't find in the cache.
      MOTIONFLOW_TEST_WEIGHTS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          environments: torch
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Cache model weights
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/motionflow/weights
            ~/.cache/torch/hub/checkpoints
          # weights.py lists the files and their checksums; torchvision's RAFT
          # weights change with its version, which the lock file pins.
          key: weights-${{ hashFiles('src/motionflow/weights.py', 'pixi.lock') }}
          restore-keys: weights-

      - name: Run deep-method tests
        run: pixi run -e torch test tests/test_deep.py tests/test_weights.py tests/test_flow.py
